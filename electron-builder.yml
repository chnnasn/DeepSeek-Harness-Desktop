appId: com.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
copyright: MIT
directories:
  output: dist
  buildResources: build
files:
  - electron/**/*
  - package.json
extraResources:
  # dsh runtime (installed by scripts/package.ps1 into build/runtime/dsh).
  # Kept outside asar as real files: node needs to spawn/load them, including
  # native addons (sharp, node-pty, koffi, ...).
  - from: build/runtime/dsh
    to: dsh
  - from: launcher/icon.ico
    to: icon.ico
  - from: electron/registries
    to: registries
asar: true
npmRebuild: false
compression: normal
win:
  icon: launcher/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop
  artifactName: DeepSeek-Harness-Desktop-Setup.exe
  installerIcon: launcher/icon.ico
  uninstallerIcon: launcher/icon.ico
  # Keep the dsh profile/plugins on uninstall; delete manually if wanted.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # Disable differential updates (blockmap): this project publishes via GitHub
  # Release (full download) and does not use electron-updater. Keeping it only
  # forces non-solid 7z, which inflates the package. Off -> solid compression is
  # restored and the setup shrinks ~24% (150 -> ~114 MB).
  differentialPackage: false
