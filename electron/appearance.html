<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自定义外观</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e3e6ea;
    --text: #1f2329; --muted: #6b7280; --accent: #4f46e5; --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; padding: 16px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row input[type=color] { width: 44px; height: 32px; border: 1px solid var(--border); border-radius: 6px; padding: 2px; cursor: pointer; background: none; }
  .color-row input[type=text] { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  .image-area { border: 1px dashed var(--border); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); }
  .image-area img { max-width: 100%; max-height: 160px; border-radius: 8px; margin-top: 10px; display: block; margin-left: auto; margin-right: auto; }
  .opacity-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .opacity-row input[type=range] { flex: 1; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 8px; padding: 8px 16px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--danger); }
  #status { margin-top: 12px; font-size: 12px; color: var(--muted); min-height: 18px; }
  #status.ok { color: #16a34a; }
  #status.err { color: var(--danger); }
</style>
</head>
<body>
  <div class="field">
    <label>品牌主色（按钮/强调）</label>
    <div class="color-row">
      <input type="color" id="brand-color" value="#4f46e5">
      <input type="text" id="brand-text" placeholder="#4f46e5">
    </div>
  </div>
  <div class="field">
    <label>业务强调色（链接/聚焦）</label>
    <div class="color-row">
      <input type="color" id="accent-color" value="#4176e6">
      <input type="text" id="accent-text" placeholder="#4176e6">
    </div>
  </div>
  <div class="field">
    <label>背景色</label>
    <div class="color-row">
      <input type="color" id="bg-color" value="#ffffff">
      <input type="text" id="bg-text" placeholder="#ffffff">
    </div>
  </div>
  <div class="field">
    <label>文字主色</label>
    <div class="color-row">
      <input type="color" id="text-color" value="#1f2329">
      <input type="text" id="text-text" placeholder="#1f2329">
    </div>
  </div>

  <div class="field">
    <label>背景图</label>
    <div class="image-area">
      <input type="file" id="image-input" accept="image/*">
      <img id="image-preview" style="display:none" alt="预览">
      <div class="opacity-row">
        <span>透明度</span>
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.15">
        <span id="opacity-val">0.15</span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="save-btn">保存</button>
    <button class="danger" id="reset-btn">重置为默认</button>
  </div>
  <div id="status"></div>

<script>
const API = "http://127.0.0.1:3091";
let backgroundImage = "";

function api(path, options) {
  return fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...options
  }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok && data.error) throw new Error(data.error);
    return data;
  });
}

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls || "";
}

// 颜色输入与文本双向同步
[["brand", "brand-color"], ["accent", "accent-color"], ["bg", "bg-color"], ["text", "text-color"]].forEach(([key, colorId]) => {
  const color = document.getElementById(colorId);
  const text = document.getElementById(key + "-text");
  color.addEventListener("input", () => { text.value = color.value; });
  text.addEventListener("input", () => { if (/^#[0-9a-fA-F]{6}$/.test(text.value.trim())) color.value = text.value.trim(); });
});

document.getElementById("image-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    backgroundImage = reader.result;
    const img = document.getElementById("image-preview");
    img.src = backgroundImage;
    img.style.display = "block";
  };
  reader.readAsDataURL(file);
});

document.getElementById("opacity").addEventListener("input", (e) => {
  document.getElementById("opacity-val").textContent = e.target.value;
});

function buildConfig() {
  const val = (t) => document.getElementById(t).value.trim();
  const config = {};
  if (val("brand-text")) config.brand = val("brand-text");
  if (val("accent-text")) config.accent = val("accent-text");
  if (val("bg-text")) config.bg = val("bg-text");
  if (val("text-text")) config.text = val("text-text");
  if (backgroundImage) {
    config.backgroundImage = backgroundImage;
    config.backgroundOpacity = parseFloat(document.getElementById("opacity").value);
  }
  return config;
}

document.getElementById("save-btn").addEventListener("click", async () => {
  try {
    await api("/appearance", { method: "POST", body: JSON.stringify({ config: buildConfig() }) });
    setStatus("已保存，立即生效", "ok");
  } catch (err) {
    setStatus("保存失败：" + err.message, "err");
  }
});

document.getElementById("reset-btn").addEventListener("click", async () => {
  try {
    await api("/appearance", { method: "POST", body: JSON.stringify({ config: {} }) });
    backgroundImage = "";
    document.getElementById("image-preview").style.display = "none";
    document.getElementById("image-input").value = "";
    setStatus("已重置为默认", "ok");
  } catch (err) {
    setStatus("重置失败：" + err.message, "err");
  }
});

// 加载已保存的配置
api("/appearance").then((config) => {
  if (!config) return;
  if (config.brand) { document.getElementById("brand-text").value = config.brand; document.getElementById("brand-color").value = config.brand; }
  if (config.accent) { document.getElementById("accent-text").value = config.accent; document.getElementById("accent-color").value = config.accent; }
  if (config.bg) { document.getElementById("bg-text").value = config.bg; document.getElementById("bg-color").value = config.bg; }
  if (config.text) { document.getElementById("text-text").value = config.text; document.getElementById("text-color").value = config.text; }
  if (config.backgroundImage) {
    backgroundImage = config.backgroundImage;
    const img = document.getElementById("image-preview");
    img.src = config.backgroundImage;
    img.style.display = "block";
  }
  if (typeof config.backgroundOpacity === "number") {
    document.getElementById("opacity").value = config.backgroundOpacity;
    document.getElementById("opacity-val").textContent = config.backgroundOpacity;
  }
}).catch(() => {});
</script>
</body>
</html>
