<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插件商城</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .custom-install { margin-left: auto; display: flex; gap: 8px; }
  .custom-install input {
    width: 340px; padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 8px; font: inherit;
  }
  .custom-install input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); border-radius: 8px;
    padding: 6px 14px; transition: background .15s, border-color .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .registry-list { display: flex; flex-direction: column; gap: 8px; }
  .registry {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .registry .name { font-weight: 600; }
  .registry .desc { font-size: 12px; color: var(--muted); }
  .registry .badge { font-size: 11px; color: var(--muted); }
  .registry.error { border-color: var(--danger); }
  .registry .error-text { font-size: 12px; color: var(--danger); }
  .registry .actions { margin-top: 6px; display: flex; gap: 8px; }
  .subscribe { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .subscribe input { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .subscribe .hint { font-size: 12px; color: var(--muted); }
  .search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; margin-bottom: 12px; }
  .plugin-list { display: flex; flex-direction: column; gap: 10px; }
  .plugin {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .plugin .info { flex: 1; min-width: 0; }
  .plugin .title { font-weight: 600; }
  .plugin .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .plugin .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .plugin .meta code { background: #f0f1f3; border-radius: 4px; padding: 1px 6px; }
  .plugin .status { font-size: 12px; white-space: nowrap; }
  .plugin .status.installed { color: var(--ok); }
  .plugin .status.busy { color: var(--muted); }
  .plugin .status.failed { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  #log {
    margin: 0 20px 20px; background: #111827; color: #d1d5db; border-radius: 10px;
    padding: 12px 16px; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow: auto; white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
<header>
  <h1>插件商城</h1>
  <div class="custom-install">
    <input id="custom-spec" placeholder="npm 包名 / github:user/repo / git+URL" />
    <button class="primary" id="custom-install-btn">安装</button>
  </div>
</header>

<div class="layout">
  <aside class="panel">
    <h2>社区库</h2>
    <div class="registry-list" id="registry-list"></div>
    <div class="subscribe">
      <input id="subscribe-url" placeholder="GitHub 仓库，如 user/repo，或完整 URL" />
      <button id="subscribe-btn">订阅库</button>
      <p class="hint">库是一个含 <code>dsh-plugins.json</code> 的仓库或地址。订阅后其插件会合并进列表。</p>
    </div>
  </aside>

  <main class="panel">
    <h2>插件</h2>
    <input class="search" id="search" placeholder="搜索插件…" />
    <div class="plugin-list" id="plugin-list"></div>
    <div class="empty" id="empty" style="display:none">暂无插件。</div>
  </main>
</div>

<pre id="log"></pre>

<script>
const API = "http://127.0.0.1:3091";
let state = { registries: [], plugins: [], installed: [] };

function api(path, options) {
  return fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...options
  }).then(async (r) => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok && data.error) throw new Error(data.error);
    return data;
  });
}

function log(msg) {
  const el = document.getElementById("log");
  el.style.display = "block";
  el.textContent += msg + "\n";
  el.scrollTop = el.scrollHeight;
}

function isInstalled(spec) {
  // spec 可能是包名、github:user/repo 等；简单按包名/片段匹配
  return state.installed.some((p) => spec === p || spec.endsWith("/" + p) || spec === "github:" + p);
}

function renderRegistries() {
  const list = document.getElementById("registry-list");
  list.innerHTML = "";
  for (const reg of state.registries) {
    const el = document.createElement("div");
    el.className = "registry" + (reg.error ? " error" : "");
    const badge = reg.source === "builtin" ? "内置" : "已订阅";
    let inner = `<div class="name">${escapeHtml(reg.title || reg.name || reg.url)}</div>`;
    if (reg.description) inner += `<div class="desc">${escapeHtml(reg.description)}</div>`;
    inner += `<div class="badge">${badge} · ${reg.plugins ? reg.plugins.length : 0} 个插件</div>`;
    if (reg.error) inner += `<div class="error-text">加载失败：${escapeHtml(reg.error)}</div>`;
    if (reg.source === "subscribed") {
      inner += `<div class="actions"><button class="danger" data-unsub="${escapeHtml(reg.url)}">取消订阅</button></div>`;
    }
    el.innerHTML = inner;
    list.appendChild(el);
  }
  list.querySelectorAll("[data-unsub]").forEach((btn) => {
    btn.addEventListener("click", () => unsubscribe(btn.dataset.unsub));
  });
}

function renderPlugins() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = state.plugins.filter((p) =>
    !q || [p.title, p.name, p.description, p.install, p.registry].some((v) => (v || "").toLowerCase().includes(q))
  );
  const list = document.getElementById("plugin-list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";
  empty.style.display = filtered.length ? "none" : "block";
  for (const p of filtered) {
    const el = document.createElement("div");
    el.className = "plugin";
    const installed = isInstalled(p.install);
    const statusText = installed ? "已安装" : "可安装";
    const statusClass = installed ? "installed" : "";
    let action = "";
    if (p._busy) {
      action = `<button disabled>处理中…</button>`;
    } else if (installed) {
      action = `<button class="danger" data-remove="${escapeHtml(p.install)}">卸载</button>`;
    } else {
      action = `<button class="primary" data-install="${escapeHtml(p.install)}">安装</button>`;
    }
    el.innerHTML = `
      <div class="info">
        <div class="title">${escapeHtml(p.title || p.name)}</div>
        <div class="desc">${escapeHtml(p.description || "")}</div>
        <div class="meta">库：${escapeHtml(p.registry || "")} · <code>${escapeHtml(p.install)}</code></div>
      </div>
      <div class="status ${statusClass} ${p._busy ? "busy" : ""}">${p._busy ? "处理中…" : statusText}</div>
      ${action}
    `;
    list.appendChild(el);
  }
  list.querySelectorAll("[data-install]").forEach((btn) => {
    btn.addEventListener("click", () => install(btn.dataset.install));
  });
  list.querySelectorAll("[data-remove]").forEach((btn) => {
    btn.addEventListener("click", () => remove(btn.dataset.remove));
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function pollJob(jobId) {
  while (true) {
    await new Promise((r) => setTimeout(r, 800));
    const job = await api("/plugins/install/" + jobId);
    if (job.status === "done") { log(`✓ 完成（${jobId}）`); return true; }
    if (job.status === "failed") { log(`✗ 失败（${jobId}）\n${job.output}`); return false; }
  }
}

async function install(spec) {
  const plugin = state.plugins.find((p) => p.install === spec);
  if (plugin) plugin._busy = true;
  renderPlugins();
  log(`▶ 安装 ${spec} …`);
  try {
    const { jobId } = await api("/plugins/install", { method: "POST", body: JSON.stringify({ spec }) });
    const ok = await pollJob(jobId);
    await refresh();
    if (ok) log(`✓ ${spec} 已安装，重启后生效`);
  } catch (err) {
    log(`✗ 安装失败：${err.message}`);
  }
  state.plugins.forEach((p) => { if (p.install === spec) delete p._busy; });
  renderPlugins();
}

async function remove(spec) {
  log(`▶ 卸载 ${spec} …`);
  try {
    const { jobId } = await api("/plugins/remove", { method: "POST", body: JSON.stringify({ spec }) });
    const ok = await pollJob(jobId);
    await refresh();
    if (ok) log(`✓ ${spec} 已卸载`);
  } catch (err) {
    log(`✗ 卸载失败：${err.message}`);
  }
}

async function subscribe() {
  const url = document.getElementById("subscribe-url").value.trim();
  if (!url) return;
  try {
    await api("/registries/subscribe", { method: "POST", body: JSON.stringify({ url }) });
    document.getElementById("subscribe-url").value = "";
    await refresh();
    log(`✓ 已订阅 ${url}`);
  } catch (err) {
    log(`✗ 订阅失败：${err.message}`);
  }
}

async function unsubscribe(url) {
  try {
    await api("/registries/unsubscribe", { method: "POST", body: JSON.stringify({ url }) });
    await refresh();
    log(`✓ 已取消订阅 ${url}`);
  } catch (err) {
    log(`✗ 取消失败：${err.message}`);
  }
}

async function refresh() {
  try {
    const [regs, inst] = await Promise.all([
      api("/registries"),
      api("/plugins/installed")
    ]);
    state.registries = regs.registries || [];
    state.plugins = regs.plugins || [];
    state.installed = inst.installed || [];
    renderRegistries();
    renderPlugins();
  } catch (err) {
    log(`✗ 加载失败：${err.message}`);
  }
}

document.getElementById("custom-install-btn").addEventListener("click", () => {
  const spec = document.getElementById("custom-spec").value.trim();
  if (spec) install(spec);
});
document.getElementById("custom-spec").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("custom-install-btn").click();
});
document.getElementById("subscribe-btn").addEventListener("click", subscribe);
document.getElementById("subscribe-url").addEventListener("keydown", (e) => {
  if (e.key === "Enter") subscribe();
});
document.getElementById("search").addEventListener("input", renderPlugins);

refresh();
</script>
</body>
</html>
